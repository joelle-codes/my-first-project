
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Booking page</title>
        </head>
<body>
<h1>Booking page</h1>
<p>Please fill in your information to book your appointment</p>
<form>
    <fieldset class="personal-information">
        <legend>Personal information (required)</legend>
        <label for="first-name">Enter your first name: 
            <input type="text" id="first-name" name="text" required>
        </label>
        <label for="last-name">Enter your last name: 
            <input typa="text" id="last-name" name="text" required>
        </label>
        <label for="email">Enter your email: 
            <input type="email" id="email" name="email" placeholder="example@gmail.com">
        </label>
        <label for="number">Enter your mobile number: 
            <input type="number" id="number" minlength="8" maxlength="8" required>
        </label>
    </fieldset>
    <input type="submit" id="submit">

    
</form>

</body>
</html>
